<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Routine</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:system-ui,sans-serif;padding:20px}
        .container{max-width:500px;width:100%;background:#fff;border-radius:24px;padding:40px 30px;box-shadow:0 4px 20px rgba(0,0,0,0.06);text-align:center}
        h1{font-size:2rem;font-weight:500;color:#1a1a1a;margin-bottom:6px}
        .time{font-size:.9rem;color:#888;margin-bottom:24px}
        .btn{background:#1a1a1a;color:#fff;border:none;padding:14px 40px;border-radius:40px;font-size:1.1rem;cursor:pointer;transition:.2s;width:100%}
        .btn:hover{background:#333}
        .btn-back{background:#e8e8e8;color:#1a1a1a}
        .btn-back:hover{background:#d0d0d0}
        .page{display:none;flex-direction:column;gap:20px}
        .page.active{display:flex}
        .card{background:#f8f8f8;border-radius:16px;padding:24px 20px;text-align:left;line-height:1.6;color:#333;font-size:.95rem;white-space:pre-line}
        .card h2{font-size:1.2rem;font-weight:500;margin-bottom:10px;text-align:center}
        .reminder{background:#fff3cd;border-left:3px solid #ffc107;padding:12px 16px;border-radius:8px;font-size:.9rem;color:#856404;display:none}
        .emoji{font-size:2.8rem;margin-bottom:4px}
        @media(max-width:480px){.container{padding:30px 20px}h1{font-size:1.6rem}}
    </style>
</head>
<body>
<div class="container">
    <div id="main" class="page active">
        <h1 id="greeting">Доброе утро, Александр!</h1>
        <div class="time" id="badge">ПН, 10:30</div>
        <button class="btn" id="start">Начать</button>
    </div>
    <div id="rec" class="page">
        <div class="card">
            <h2 id="recTitle">Рекомендация</h2>
            <p id="recText"></p>
            <div class="reminder" id="reminder">⚠️ <span id="reminderText"></span></div>
        </div>
        <button class="btn btn-back" id="back">Назад</button>
    </div>
</div>

<script>
const main = document.getElementById('main');
const rec = document.getElementById('rec');
const emoji = document.getElementById('emoji');
const greeting = document.getElementById('greeting');
const badge = document.getElementById('badge');
const start = document.getElementById('start');
const back = document.getElementById('back');
const recText = document.getElementById('recText');
const recTitle = document.getElementById('recTitle');
const reminder = document.getElementById('reminder');
const reminderText = document.getElementById('reminderText');

const dayNames = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const fullDay = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

function getPeriod(h) {
    if (h >= 6 && h < 12) return 'Утро';
    if (h >= 20 && h < 2) return 'Вечер';
    if (h >= 12 && h < 20) return 'День';
    return 'День';
}

function update() {
    const now = new Date();
    const h = now.getHours();
    const p = getPeriod(h);
    const d = now.getDay();
    const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    greeting.textContent = p === 'Утро' ? 'Доброе утро, Александр!' : p === 'День' ? 'Добрый день, Александр!' : 'Добрый вечер, Александр!';
    badge.textContent = fullDay[d] + ', ' + t;
}

function showRec() {
    const now = new Date();
    const h = now.getHours();
    const p = getPeriod(h);
    const d = dayNames[now.getDay()];
    
    let text = '';

    if (p === 'Вечер') {
        reminder.style.display = 'block';
        reminderText.textContent = 'Лиля выпила зафриллу? Если нет, напомните ей.';
    } else {
        reminder.style.display = 'none';
    }

    if ((d === 'ПН' || d === 'ЧТ') && p === 'Вечер') {
        text = 'Умойтесь пенкой. Если наносили днем СПФ - умойтесь гидрофилкой. Нанесите тонкий слой геля Bioderma, дождитесь высыхания, затем одну горошину крема Скиноклир. После высыхания крема по желанию нанесите вновь тонкий слой геля Bioderma.';
    } else if (p === 'Утро') {
        text = 'Умойтесь пенкой или водой. Нанесите легкий слой СПФ на лицо, руки.';
    } else if (p === 'День') {
        text = 'Сейчас день. Умываться или наносить уход не нужно!';
    } else {
        text = 'Умойтесь пенкой или водой. Если наносили днем СПФ - умойтесь гидрофилкой. Нанесите увлажняющий крем или сыворотку.';
    }
    
    recText.textContent = text;
    recTitle.textContent = p === 'Утро' ? '🌅 Утренний уход' : p === 'День' ? 'Прекрасного дня' : '🌙 Вечерний уход';
    
    main.classList.remove('active');
    rec.classList.add('active');
}

function goHome() {
    rec.classList.remove('active');
    main.classList.add('active');
    update();
}

start.onclick = showRec;
back.onclick = goHome;
update();
setInterval(function() {
    if (main.classList.contains('active')) {
        update();
    }
}, 60000);
</script>
</body>
</html>
